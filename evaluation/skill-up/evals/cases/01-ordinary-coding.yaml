id: ordinary-coding
title: Ordinary coding does not use PowerContext
description: Refactoring a self-contained function does not require a PowerContext operation.
input:
  prompt: |
    Refactor the following Python function to remove the duplicated condition:

    def check(x):
        if x > 10:
            return True
        if x > 10:
            return True
        return False
